<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Noto Sans CJK TC', 'PingFang TC', 'Microsoft JhengHei', Helvetica, Arial, sans-serif">
<title>Sticker flow of dafeiyu-companion</title><desc>This turn: the chat model writes the reply; the plugin cleans it, decides, picks a sticker and appends a MEDIA line; Discord shows the image and the transcript keeps the line. Next turn: middleware shows that line to the chat model as the caption.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="390" y="400" width="264" height="196" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
<rect x="404" y="410" width="96" height="24" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.75"/><text x="452.0" y="422" fill="#2C2C2A" font-size="12" text-anchor="middle" dominant-baseline="central">Next turn</text>
<path d="M205 76 L205 102" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M205 160 L205 186" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M370 216 L402 216" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M205 244 L205 270" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M205 328 L205 354" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M205 412 L205 426 L118 426 L118 438" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M205 426 L291 426 L291 438" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M370 468 L402 468" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M522 496 L522 522" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="20" width="330" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.75"/><text x="205.0" y="39" fill="#26215C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Chat model writes the reply</text><text x="205.0" y="59" fill="#3C3489" font-size="12" text-anchor="middle" dominant-baseline="central">Text only, no stickers</text>
<rect x="40" y="104" width="330" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/><text x="205.0" y="123" fill="#04342C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">1  Clean</text><text x="205.0" y="143" fill="#085041" font-size="12" text-anchor="middle" dominant-baseline="central">Remove sticker text the model wrote</text>
<rect x="40" y="188" width="330" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/><text x="205.0" y="207" fill="#04342C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">2  Decide (deepseek-flash)</text><text x="205.0" y="227" fill="#085041" font-size="12" text-anchor="middle" dominant-baseline="central">不貼 (no sticker), or quote + reaction</text>
<rect x="404" y="188" width="236" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.75"/><text x="522.0" y="207" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">No sticker</text><text x="522.0" y="227" fill="#444441" font-size="12" text-anchor="middle" dominant-baseline="central">Reply sent as text only</text>
<rect x="40" y="272" width="330" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/><text x="205.0" y="291" fill="#04342C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">3  Pick (deepseek-flash)</text><text x="205.0" y="311" fill="#085041" font-size="12" text-anchor="middle" dominant-baseline="central">Full list or embedding top 8, skip last 10</text>
<rect x="40" y="356" width="330" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/><text x="205.0" y="375" fill="#04342C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">4  Send</text><text x="205.0" y="395" fill="#085041" font-size="12" text-anchor="middle" dominant-baseline="central">Append MEDIA:&lt;path&gt; to the reply</text>
<rect x="40" y="440" width="157" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.75"/><text x="118.5" y="459" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Discord</text><text x="118.5" y="479" fill="#444441" font-size="12" text-anchor="middle" dominant-baseline="central">Shows text and image</text>
<rect x="213" y="440" width="157" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.75"/><text x="291.5" y="459" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Transcript</text><text x="291.5" y="479" fill="#444441" font-size="12" text-anchor="middle" dominant-baseline="central">Keeps the MEDIA line</text>
<rect x="404" y="440" width="236" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/><text x="522.0" y="459" fill="#04342C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">5  Middleware rewrites it</text><text x="522.0" y="479" fill="#085041" font-size="12" text-anchor="middle" dominant-baseline="central">MEDIA line → [貼圖：caption]</text>
<rect x="404" y="524" width="236" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.75"/><text x="522.0" y="543" fill="#26215C" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Chat model reads history</text><text x="522.0" y="563" fill="#3C3489" font-size="12" text-anchor="middle" dominant-baseline="central">Sees caption, not image or path</text>
<rect x="40" y="524" width="150" height="24" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.75"/><text x="115.0" y="536" fill="#26215C" font-size="12" text-anchor="middle" dominant-baseline="central">Hermes chat model</text>
<rect x="40" y="556" width="150" height="24" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/><text x="115.0" y="568" fill="#04342C" font-size="12" text-anchor="middle" dominant-baseline="central">This plugin</text>
</svg>
